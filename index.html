<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تحدي الإيثار</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(145deg,#eee7ff,#faf8ff);color:#35205a;min-height:100vh;display:grid;place-items:center;padding:18px}.app{width:min(100%,560px);background:white;border-radius:26px;padding:25px;box-shadow:0 15px 45px #6c40a92b;text-align:center}h1{color:#6c36ae;margin:12px 0}h2{font-size:1.35rem;line-height:1.8}.sub{color:#7c6b91}.pill{display:inline-block;background:#f0e6ff;color:#6532a4;border-radius:30px;padding:9px 17px;font-weight:bold}.stats{display:flex;justify-content:space-between;gap:10px;margin:20px 0;font-weight:bold}.bar{height:12px;background:#eee4fa;border-radius:20px;overflow:hidden}.fill{height:100%;background:#8a55d3;width:0;transition:width .25s}.answers{display:grid;gap:12px;margin-top:20px}button{font:inherit;cursor:pointer;border:0;border-radius:15px;padding:15px;background:#773db9;color:white;font-weight:bold;font-size:1rem}button.choice{background:#f4effc;color:#48236f;border:2px solid #e4d5f7}button.choice:hover{background:#e9dcfa}button:disabled{cursor:default;opacity:.85}.correct{background:#d5f5e3!important;border-color:#36a46b!important;color:#165d35!important}.wrong{background:#ffe1e4!important;border-color:#e56777!important;color:#8d2734!important}.feedback{min-height:60px;font-weight:bold;line-height:1.7;margin:14px 0}.hidden{display:none}.footer{margin-top:25px;color:#7b6795;font-size:.9rem}.emoji{font-size:3.2rem}#next{width:100%}</style></head><body><main class="app"><div class="emoji">💜📚</div><h1>تحدي الإيثار</h1><p class="sub">لغتي الجميلة | الصف الثالث الابتدائي</p><section id="start"><p class="pill">اختاري الإجابة الصحيحة واجمعي النجوم ⭐</p><h2>هل أنتِ مستعدة لتحدي الإيثار؟</h2><button onclick="begin()">ابدئي اللعب 🎮</button></section><section id="game" class="hidden"><div class="stats"><span id="count"></span><span id="score"></span></div><div class="bar"><div id="fill" class="fill"></div></div><h2 id="question"></h2><div id="answers" class="answers"></div><p id="feedback" class="feedback" aria-live="polite"></p><button id="next" class="hidden" onclick="advance()">السؤال التالي ←</button></section><section id="end" class="hidden"><div class="emoji">🏆🌟</div><h2>أحسنتِ يا بطلة الإيثار!</h2><p id="result"></p><p>الإيثار خُلُق جميل، فلنطبقه في حياتنا كل يوم.</p><button onclick="begin()">العبي مرة أخرى 🔄</button></section><div class="footer">إعداد المعلمة: سارة العتيبي 💜</div></main><script>const questions=[{q:'ما معنى الإيثار؟',a:['تقديم الآخرين على النفس في الخير','الاحتفاظ بكل شيء لنفسي','رفض مساعدة الآخرين'],c:0,tip:'الإيثار هو تقديم الآخرين على النفس في الخير.'},{q:'رأيتِ زميلتكِ نسيت أدواتها، ماذا تفعلين؟',a:['أتجاهلها','أشاركها أدواتي','أضحك عليها'],c:1,tip:'مشاركة الأدوات مثال جميل على الإيثار.'},{q:'أي المواقف يدل على الإيثار؟',a:['أختار كل الألعاب لنفسي','أمنع صديقتي من المشاركة','أترك لصديقتي فرصة اللعب أولًا'],c:2,tip:'تقديم فرصة للآخرين سلوك كريم.'},{q:'الإيثار يدل على...',a:['الأنانية','المحبة والتعاون','الكسل'],c:1,tip:'الإيثار ينشر المحبة والتعاون.'},{q:'عند وجود مقعد واحد وزميلتك متعبة، ماذا تفعلين؟',a:['أعرض عليها المقعد','أتسابق لأجلس أولًا','أتجاهل تعبها'],c:0,tip:'مراعاة حاجة الآخرين من صور الإيثار.'},{q:'ما عكس الإيثار؟',a:['الكرم','التعاون','الأنانية'],c:2,tip:'الأنانية تعني الاهتمام بالنفس دون مراعاة الآخرين.'},{q:'لديكِ طعام إضافي وزميلتكِ لا تملك طعامًا، ما التصرف الأفضل؟',a:['أشاركها طعامي','أخفي الطعام عنها','أرمي الطعام'],c:0,tip:'المشاركة والعطاء من الأخلاق الحسنة.'},{q:'كيف نجعل الإيثار عادة يومية؟',a:['نساعد الآخرين ونراعي حاجاتهم','نرفض التعاون','نفكر في أنفسنا فقط'],c:0,tip:'نمارس الإيثار بأعمال بسيطة كل يوم.'}];let i=0,points=0,locked=false;const el=id=>document.getElementById(id);function show(s){['start','game','end'].forEach(id=>el(id).classList.toggle('hidden',id!==s))}function begin(){i=0;points=0;show('game');render()}function render(){locked=false;el('count').textContent=`السؤال ${i+1} من ${questions.length}`;el('score').textContent=`⭐ ${points} نقطة`;el('fill').style.width=`${i/questions.length*100}%`;el('question').textContent=questions[i].q;el('feedback').textContent='';el('next').classList.add('hidden');el('answers').innerHTML='';questions[i].a.forEach((a,j)=>{let b=document.createElement('button');b.className='choice';b.textContent=a;b.onclick=()=>answer(j);el('answers').appendChild(b)})}function answer(j){if(locked)return;locked=true;let q=questions[i],ok=j===q.c;if(ok)points+=10;[...el('answers').children].forEach((b,k)=>{b.disabled=true;if(k===q.c)b.classList.add('correct');else if(k===j)b.classList.add('wrong')});el('score').textContent=`⭐ ${points} نقطة`;el('feedback').textContent=(ok?'أحسنتِ! إجابة صحيحة 🌟 ':'حاولي في السؤال القادم 💜 ')+q.tip;el('next').textContent=i===questions.length-1?'شاهدي النتيجة 🏆':'السؤال التالي ←';el('next').classList.remove('hidden')}function advance(){i++;if(i===questions.length){show('end');el('result').textContent=`حصلتِ على ${points} من ${questions.length*10} نقطة ⭐`;el('fill').style.width='100%'}else render()}</script></body></html>
